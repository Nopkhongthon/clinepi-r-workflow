project:
  type: default
  output-dir: docs
  execute-dir: project
  render:
    - index.qmd
  resources:
    - .nojekyll

bibliography: packages.bib

execute:
  freeze: false
  echo: true
  warning: false

knitr:
  opts_chunk:
    message: true    # execute: warning: false would otherwise hide message() too

format:
  html:
    theme:
      light: cosmo   # plain Bootstrap themes; the toggle at the top switches
      dark: darkly
    embed-resources: true   # styles, scripts and plots live inside each .html file
    code-copy: true
    code-overflow: wrap
    toc: true
    toc-depth: 2
    toc-location: left
    toc-title: Contents
    number-sections: true
    fig-width: 7
    fig-height: 4
    fig-dpi: 110
    df-print: default
